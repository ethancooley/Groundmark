<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Groundmark</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>Groundmark</h1>
        <p class="sub">Checks Google's AI Overviews against the pages they cite.</p>
      </div>
    </header>

    <section id="tab" aria-live="polite">
      <p class="empty">Search on Google. When an AI Overview appears, each sentence gets a verdict.</p>
    </section>

    <section class="status-list" aria-label="Setup">
      <button type="button" class="status-row" data-section="read">
        <span><strong>Reading cited pages</strong><small id="readStatus">Checking…</small></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <button type="button" class="status-row" data-section="model">
        <span><strong>On-device AI</strong><small id="modelStatus">Checking…</small></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </section>

    <section class="settings">
      <label class="toggle">
        <span>
          <strong>Check automatically</strong>
          <small>Off: a button appears on each Overview instead.</small>
        </span>
        <input type="checkbox" id="autoRun" role="switch" />
      </label>
    </section>

    <footer>
      <p>Everything runs on this computer. Groundmark has no server and sends nothing anywhere except to open the pages Google cited.</p>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
